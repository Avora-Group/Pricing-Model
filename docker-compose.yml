# Local development stack — database + API in Docker, frontend runs natively.
#
#   docker compose up --build          # Postgres + FastAPI (migrated + seeded)
#   cd nextjs-project && npm run dev   # frontend with hot reload on :3000
#
# The API runs its SQL migrations itself on startup (app/main.py lifespan);
# the one-shot `seed` service then populates the aircraft fleet and pricing
# config once the API reports healthy. See docs/local-dev.md for the runbook
# (including how to set a known local admin password).

services:
  db:
    # Matches Railway production (Debian, Postgres 18.x) so pg_dump/pg_restore
    # work in both directions when cloning prod data locally. Deliberately NOT
    # the -alpine variant: musl has no locale collation, so en_US.utf8 silently
    # degrades to byte ordering and text ORDER BY diverges from production.
    image: postgres:18
    environment:
      POSTGRES_DB: acmi_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host 5434: 5432 is taken by the asset-app stack's Postgres and 5433 by
      # the task-tracker stack's. A clash here leaves the db container created
      # but detached from the compose network, so the api can't resolve `db`.
      # In-network traffic (api -> db:5432) is unaffected by this mapping.
      - "5434:5432"
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql (not .../data as on 16 and earlier).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acmi_platform"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/acmi_platform
      JWT_SECRET: local-dev-secret-not-for-production-use
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:3001
    ports:
      - "8079:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python:slim has no curl/wget — probe /health with stdlib urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: seeds the 11-MSN fleet + pricing config after the API has
  # started (migrations run inside the API's startup, so tables exist by the
  # time this fires). Both scripts are idempotent — safe on every `up`.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/acmi_platform
    command: >
      sh -c "python scripts/seed_aircraft.py && python scripts/seed_pricing_config.py"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
